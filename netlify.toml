# Netlify configuration for Track Record.
#
# Netlify hosts:
#   - the built React app and landing page (client/dist → publish)
#   - the Express server, wrapped as a Netlify Function (netlify/functions/api.js)
#   - the hourly notice sweep, as a Scheduled Function (netlify/functions/sweep-notices.js)
#
# Supabase holds the database and file storage. See DEPLOY.md for the full picture.

[build]
  # Root package.json "build" installs server + client deps and builds the client.
  command = "npm run build"
  # Vite writes the app to client/dist/app and copies the landing page to client/dist.
  publish = "client/dist"

[functions]
  directory = "netlify/functions"
  external_node_modules = ["express", "pg", "bcrypt"]
  node_bundler = "esbuild"

[functions.api]
  # A media response can take longer than the default 10s while reading from Supabase Storage.
  included_files = []

[[redirects]]
  force = true
  from = "/api/*"
  status = 200
  to = "/.netlify/functions/api/:splat"

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api/health"
  status = 200

[[redirects]]
  from = "/health/db"
  to = "/.netlify/functions/api/health/db"
  status = 200

# SPA fallback for the React app (it lives under /app/). Must come after /api/* and /health.
[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200
