[build]
  command = "npm run build"
  publish = "client/dist"

[functions]
  directory = "netlify/functions"
  external_node_modules = ["express", "pg", "bcrypt"]
  node_bundler = "esbuild"

[[redirects]]
  force = true
  from = "/api/*"
  status = 200
  to = "/.netlify/functions/api/:splat"

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api/health"
  status = 200

[[redirects]]
  from = "/health/db"
  to = "/.netlify/functions/api/health/db"
  status = 200

# SPA fallback for the React app only (landing page stays at /)
[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200