# Pings the API every 3 days so the free Supabase database is not paused for inactivity.
name: keep-alive
on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      API_URL: ${{ vars.API_URL || 'https://trackrecordrw.netlify.app' }}
    steps:
      - name: Check the target URL
        run: |
          if [ -z "$API_URL" ]; then
            echo "API_URL is empty. Set the API_URL repository variable." >&2
            exit 1
          fi
          echo "Pinging $API_URL/health/db"
      - name: Ping the database through the API
        run: curl --fail --silent --show-error --max-time 90 --retry 3 --retry-delay 20 "${API_URL%/}/health/db"